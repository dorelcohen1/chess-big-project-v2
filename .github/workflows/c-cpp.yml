name: C++ Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with MSVC
        run: |
          mkdir build
          cl /std:c++20 /EHsc *.cpp /Fe:build\program.exe

      - name: Test run
        run: build\program.exe
